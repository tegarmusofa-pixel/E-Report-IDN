<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

</head>
<body>

    <nav class="navbar topbar px-4">
        <span class="navbar-brand text-white fw-bold">
            E-Report <span class="brand-light">Santri</span> 
        </span>
        <div class="admin-profile">
            <div>
                <span>Admin</span>
                <small>Pengelola sistem</small>
            </div>
            <div class="admin-avatar">AD</div>
        </div>
    </nav>
    <div class="row">
        <aside class="sidebar col-lg-2 p-4">
            <h5 class="menu-label">Menu</h5>
            <a href="index.html" class="menu-link"><i class="bi bi-bar-chart"></i> Dashboard</a>
            <a href="statstik.html" class="menu-link"><i class="bi bi-clipboard-data"></i> Data Laporan</a>
            <a href="setting.html" class="menu-link active"> <i class="bi bi-gear"></i> Pengaturan</a>
        </aside>
        <main class="col-lg-10 p-4">
            <h2>Pengaturan sistem</h2>
            <p>kelola informasi admin</p>
            
            <div class="row">
                <div class="col-lg-6">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5><i class=" bi bi-person-circle"></i></h5>
                        </div>
                        <div class="card-body">
                            <form action="">
                                <div class="md-3">
                                <label for="" class="form-label">Nama Admin</label>
                                <input type="text" value="Admin santri" class="form-control">
                                </div>
                                <div class="md-3">
                                <label for="" class="form-label">Email</label>
                                <input type="text" value="admin@idn.com" class="form-control">
                                </div>
                                <div class="md-3">
                                <label for="" class="form-label">Jabatan</label>
                                <input type="text" value="administrator" class="form-control">
                                </div>
                                <button class="btn btn-primary mt-3">
                                    <i class="bi bi-floppy"></i>
                                    simpan profil
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5><i class=" bi bi-person-circle">Nama Aplikasi</i></h5>
                        </div>
                        <div class="card-body">
                            <form action="">
                                <div class="md-3">
                                <label for="" class="form-label">Nama Aplikasi</label>
                                <input type="text" value="E-report Santri" class="form-control">
                                </div>
                                <div class="md-3">
                                <label for="" class="form-label">Nama Sekolah</label>
                                <input type="text" value="IDNBS" class="form-control">
                                </div>
                                <div class="md-3">
                                <label for="" class="form-label">Deskripsi Aplikasi</label>
                                <input type="text" value="sistem pelaporan santri" class="form-control">
                                </div>
                                <button class="btn btn-primary mt-3">
                                    <i class="bi bi-check"></i>
                                    simpan identitas
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h5> <i class="bi bi-bell text-warning"></i>
                                    Prefrensi Sistem
                                    </h5>
                                </div>
                                <div class="form-check form-switch">
                                    <input type="checkbox" class="form-check-input">
                                    <label for="form-check-label">
                                        Aktifkan Notifikasi
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
        </main>
    </div>
    
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
 
</body>
</html>
