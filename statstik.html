<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

</head>
<body>

    <nav class="navbar topbar px-4">
        <span class="navbar-brand text-white fw-bold">
            E-Report <span class="brand-light">Santri</span> 
        </span>
        <div class="admin-profile">
            <div>
                <span>Admin</span>
                <small>Pengelola sistem</small>
            </div>
            <div class="admin-avatar">AD</div>
        </div>
    </nav>
    <div class="row">
        <aside class="sidebar col-lg-2 p-4">
            <h5 class="menu-label">Menu</h5>
            <a href="index.html" class="menu-link"> <i class="bi bi-bar-chart"></i> Dashboard</a>
            <a href="statstik.html" class="menu-link active"> <i class="bi bi-clipboard-data"></i> Data Laporan</a>
            <a href="setting.html" class="menu-link"> <i class="bi bi-gear"></i> Pengaturan</a>
        </aside>
        <main class="col-lg-10 p-4">
            <h2>Data Laporan statistik</h2>
            
            <div class="row">
              <div class="col-lg-8">
                <div class="card">
                  <div class="card-body">
                    <h5>Statistik Laporan</h5>
                    <p>Jumlah Laporan Santri setiap bulan</p>
                    <div class="area-grafik"></div>
                    <canvas class="" id="santrichart"></canvas>

                  </div>
                </div>
              </div>
              <div class="col-lg-4">
                <div class="card">
                  <div class="card-body">
                    <H5>Status Laporan</H5>
                    <p>Laporan Santri</p>
                    <div class="area-doughtnut"></div>
                    <canvas class="" id="laporansantri"></canvas>
                  </div>
                </div>
              </div>
            </div>
            
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>>
    <script>
      const ctx = document.getElementById('santrichart')

      new Chart(ctx, {
        type: 'bar',
        data: {
              labels: ["Januari","Februari","Maret","April","Maret"],
              datasets: [{
                      label: "Jumlah Laporan per-Bulan",
                      data: [10,14,7,9,2],
                      backgroundColor:[
                        "royalblue",
                        "red",
                        "green",
                        "yellow",
                        "orange"],
                      
                        
                        
                        

                      borderWidth: 3
              }]
        },
        options:{
          plugins:{
            legend:{
              position: 'bottom'
            }
          }
        }
      })
      const donat = document.getElementById('laporansantri')

      new Chart(donat, {
        type: 'doughnut',
        data: {
              labels: ["setuju","ditolak","menunggu",],
              datasets: [{
                      label: "Jumlah Laporan per-Bulan",
                      data: [10,14,7,],
                      backgroundColor:[
                        "royalblue",
                        "red",
                        "green",
              ],
                      
                        
                        
                        

                      borderWidth: 3
              }]
        },
        options:{
          plugins:{
            legend:{
              position: 'bottom'
            }
          }
        }
      })
</script>
 
</body>
</html>
